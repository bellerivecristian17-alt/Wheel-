
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Me & Navaeh 💙🖤</title>
<style>
body {
  background: linear-gradient(135deg, #020617, #082f49);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 10px;
}
h1 { color: #60a5fa; }
#wheel {
  width: 260px;
  height: 260px;
  margin: 25px auto;
  border-radius: 50%;
  border: 6px solid white;
  background: conic-gradient(#2563eb 0deg 180deg, #111827 180deg 360deg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: bold;
  box-shadow: 0 0 25px #3b82f6;
}
button {
  background: #3b82f6;
  color: white;
  border: 0;
  border-radius: 14px;
  padding: 15px 25px;
  font-size: 18px;
}
#result {
  font-size: 28px;
  color: #93c5fd;
}
</style>
</head>
<body>
<h1>💙 Me & Navaeh 🖤</h1>
<div id="wheel">YES • NO</div>
<button onclick="spin()">SPIN THE WHEEL</button>
<p id="result">Ready? 💙</p>

<script>
function spin() {
  document.getElementById("result").textContent =
    Math.random() < 0.5 ? "💙 YES! 💙" : "🖤 NO 🖤";
}
</script>
</body>
</html>
